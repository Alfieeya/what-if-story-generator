<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>What If — A Story Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="stage">

    <header class="eyebrow-row">
      <span class="eyebrow">A GENERATIVE FICTION MACHINE</span>
      <span class="eyebrow-dot" aria-hidden="true">•</span>
      <span class="eyebrow">ONE PREMISE, ONE PATH</span>
    </header>

    <section class="premise-block" aria-labelledby="premise-heading">
      <h1 id="premise-heading" class="premise-sentence">
        <span class="premise-lead">What if</span>
        <span class="premise-input-wrap">
          <input
            id="promptInput"
            class="premise-input"
            type="text"
            placeholder="the moon sent us a letter"
            maxlength="240"
            autocomplete="off"
            spellcheck="false"
          />
          <span class="premise-caret" aria-hidden="true"></span>
        </span>
        <span class="premise-lead">&nbsp;?</span>
      </h1>

      <div class="controls">
        <div class="control-group" role="group" aria-label="Genre">
          <span class="control-label">GENRE</span>
          <div class="pill-row" id="genreRow">
            <button type="button" class="pill is-active" data-genre="any">Any</button>
            <button type="button" class="pill" data-genre="scifi">Sci-Fi</button>
            <button type="button" class="pill" data-genre="fantasy">Fantasy</button>
            <button type="button" class="pill" data-genre="mystery">Mystery</button>
            <button type="button" class="pill" data-genre="historical">Historical</button>
            <button type="button" class="pill" data-genre="comedy">Comedy</button>
            <button type="button" class="pill" data-genre="horror">Horror</button>
          </div>
        </div>

        <div class="control-group" role="group" aria-label="Length">
          <span class="control-label">LENGTH</span>
          <div class="pill-row" id="lengthRow">
            <button type="button" class="pill" data-length="short">Short</button>
            <button type="button" class="pill is-active" data-length="medium">Medium</button>
            <button type="button" class="pill" data-length="long">Long</button>
          </div>
        </div>
      </div>

      <button id="generateBtn" class="spin-btn" type="button">
        <span class="spin-btn-label">Spin the story</span>
        <span class="spin-btn-spark" aria-hidden="true"></span>
      </button>

      <p id="errorMsg" class="error-msg" role="alert" hidden></p>
    </section>

    <section class="branch-track" id="branchTrack" aria-hidden="true" hidden>
      <svg viewBox="0 0 400 40" class="branch-svg" preserveAspectRatio="none">
        <line x1="0" y1="20" x2="400" y2="20" class="branch-line" />
      </svg>
      <span class="branch-ember" id="branchEmber"></span>
      <span class="branch-status" id="branchStatus">weighing possibilities…</span>
    </section>

    <section class="manuscript" id="manuscript" hidden aria-live="polite">
      <div class="manuscript-spine" aria-hidden="true"></div>
      <div class="manuscript-body">
        <p id="storyText" class="story-text"></p>
      </div>
      <div class="manuscript-actions">
        <button id="copyBtn" class="ghost-btn" type="button">Copy story</button>
        <button id="downloadBtn" class="ghost-btn" type="button">Download .txt</button>
        <button id="againBtn" class="ghost-btn" type="button">Try another premise</button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
